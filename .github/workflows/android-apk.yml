name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a09aeb-dager-hunter
      - main

permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd android
          set +e
          gradle --no-daemon assembleDebug --stacktrace --info > ../android-build.log 2>&1
          status=$?
          tail -300 ../android-build.log
          exit $status

      - name: Commit failure log for diagnostics
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mv android-build.log android-build-failure.log
          git add android-build-failure.log
          git commit -m "Add Android CI failure log [skip ci]" || true
          git push origin HEAD:arena/01a09aeb-dager-hunter || true

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DagerHunter-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DagerHunter-debug-apk
          path: artifacts/DagerHunter-debug.apk
          if-no-files-found: error
