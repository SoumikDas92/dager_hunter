name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a09aeb-dager-hunter
      - main

permissions:
  contents: write

jobs:
  apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/DagerHunter-debug.apk

      - name: Commit APK to branch
        if: github.ref == 'refs/heads/arena/01a09aeb-dager-hunter'
        run: |
          mkdir -p downloadable
          cp artifacts/DagerHunter-debug.apk downloadable/DagerHunter-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f downloadable/DagerHunter-debug.apk
          git commit -m "Update downloadable debug APK [skip ci]" || echo "No APK changes to commit"
          git push origin HEAD:arena/01a09aeb-dager-hunter

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DagerHunter-debug-apk
          path: artifacts/DagerHunter-debug.apk
          if-no-files-found: error
