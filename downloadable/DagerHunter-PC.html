<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#170b25" />
    <meta name="description" content="Dager Hunter - offline PC/Android single-file build" />
    <title>Dager Hunter PC</title>
    <style>
:root {
  color-scheme: dark;
  --ink: #130b1f;
  --panel: rgba(24, 11, 37, 0.78);
  --panel-strong: rgba(24, 11, 37, 0.94);
  --line: rgba(255, 255, 255, 0.18);
  --cream: #ffecc7;
  --muted: #bca9cf;
  --blood: #e52c59;
  --blood-dark: #7e1233;
  --gold: #ffd166;
  --cyan: #70e8ff;
  --green: #8cff7e;
  --shadow: rgba(0, 0, 0, 0.45);
  font-family: Inter, ui-rounded, "Trebuchet MS", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  touch-action: none;
  user-select: none;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at 50% 30%, #3a1d4d 0%, #150a22 58%, #07040b 100%);
}

button {
  font: inherit;
}

#game-shell {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: #170b25;
}

#game-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  background: #24422e;
}

#hud,
#touch-controls,
#modal-backdrop,
#orientation-tip {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.hud-panel {
  pointer-events: auto;
  border: 2px solid rgba(255, 236, 199, 0.16);
  border-radius: 18px;
  background: linear-gradient(135deg, rgba(28, 13, 46, 0.88), rgba(77, 22, 61, 0.58));
  box-shadow: 0 10px 30px var(--shadow), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(8px);
}

#top-left-hud {
  position: absolute;
  left: max(10px, env(safe-area-inset-left));
  top: max(10px, env(safe-area-inset-top));
  width: min(360px, calc(100vw - 20px));
  padding: 10px 12px 11px;
}

.brand-row {
  display: flex;
  gap: 10px;
  align-items: center;
  color: var(--cream);
  text-shadow: 0 2px 0 #000;
  letter-spacing: 0.02em;
  margin-bottom: 8px;
}

.brand-row small {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.brand-mark {
  display: grid;
  place-items: center;
  width: 34px;
  height: 34px;
  border-radius: 12px;
  background: #e52c59;
  color: white;
  font-size: 22px;
  border: 2px solid #0b0612;
  box-shadow: 0 3px 0 #000, 0 0 18px rgba(229, 44, 89, 0.45);
}

.bar-wrap {
  position: relative;
  height: 18px;
  overflow: hidden;
  border: 2px solid #09050e;
  border-radius: 999px;
  background: rgba(0, 0, 0, 0.38);
  box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.55);
}

.bar-wrap + .bar-wrap {
  margin-top: 6px;
}

.bar-fill {
  width: 100%;
  height: 100%;
  border-radius: inherit;
  transform-origin: left center;
  transition: width 120ms ease-out;
}

.health-wrap .bar-fill {
  background: linear-gradient(90deg, #ff315f, #ff8aa3);
  box-shadow: 0 0 16px rgba(255, 49, 95, 0.55);
}

.xp-wrap .bar-fill {
  background: linear-gradient(90deg, #6c5cff, #70e8ff);
}

.enemy-wrap .bar-fill {
  background: linear-gradient(90deg, #ffb703, #fb5607);
}

.bar-text {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  color: white;
  font-size: 11px;
  font-weight: 800;
  text-shadow: 0 1px 2px #000, 0 0 3px #000;
}

.stat-line {
  margin-top: 7px;
  font-size: 12px;
  color: var(--cream);
  text-shadow: 0 1px 0 #000;
}

.muted {
  color: var(--muted);
}

#top-right-hud {
  position: absolute;
  top: max(10px, env(safe-area-inset-top));
  right: max(10px, env(safe-area-inset-right));
  padding: 8px;
  display: grid;
  gap: 8px;
  justify-items: end;
}

#pause-button,
#modal-close,
.hud-button {
  pointer-events: auto;
  border: 2px solid #08040d;
  border-radius: 14px;
  min-width: 44px;
  min-height: 40px;
  color: var(--cream);
  background: linear-gradient(#50306d, #251238);
  box-shadow: 0 4px 0 #050309, 0 8px 18px rgba(0, 0, 0, 0.35);
}

#pause-button:active,
#modal-close:active,
.game-button:active {
  transform: translateY(2px) scale(0.98);
  box-shadow: 0 2px 0 #050309, 0 4px 10px rgba(0, 0, 0, 0.25);
}

#minimap {
  width: 156px;
  height: 104px;
  border-radius: 12px;
  border: 2px solid #0a0710;
  background: rgba(13, 8, 20, 0.72);
}

#enemy-card {
  position: absolute;
  left: 50%;
  top: max(12px, env(safe-area-inset-top));
  transform: translateX(-50%);
  width: min(360px, 42vw);
  padding: 10px;
}

.enemy-title-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 6px;
  color: var(--cream);
  font-size: 13px;
  text-shadow: 0 1px 0 #000;
}

#enemy-bleed-pill {
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(229, 44, 89, 0.32);
  color: #ffc4d1;
  font-size: 11px;
  border: 1px solid rgba(255, 255, 255, 0.14);
}

#combo-strip {
  position: absolute;
  left: 50%;
  bottom: calc(118px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  padding: 8px 14px;
  color: var(--cream);
  font-weight: 800;
  font-size: 13px;
  letter-spacing: 0.02em;
  text-shadow: 0 2px 0 #000;
  white-space: nowrap;
}

#ability-row {
  position: absolute;
  left: 50%;
  top: calc(76px + env(safe-area-inset-top));
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 48vw;
}

.ability-chip {
  pointer-events: none;
  padding: 5px 9px;
  border-radius: 999px;
  border: 2px solid rgba(255, 255, 255, 0.18);
  background: rgba(26, 12, 42, 0.78);
  color: var(--cream);
  font-size: 11px;
  font-weight: 800;
  text-shadow: 0 1px 0 #000;
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
}

#notifications {
  position: absolute;
  left: 50%;
  bottom: calc(175px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  display: grid;
  gap: 6px;
  justify-items: center;
  width: min(520px, 80vw);
}

.toast {
  padding: 8px 12px;
  border-radius: 999px;
  border: 2px solid rgba(255, 255, 255, 0.14);
  background: rgba(17, 8, 29, 0.86);
  color: var(--cream);
  font-size: 13px;
  font-weight: 800;
  text-shadow: 0 1px 0 #000;
  box-shadow: 0 8px 26px rgba(0, 0, 0, 0.4);
  animation: toast-in 180ms ease-out;
}

.toast.good {
  border-color: rgba(140, 255, 126, 0.45);
}

.toast.danger {
  border-color: rgba(255, 49, 95, 0.55);
}

.toast.parry {
  color: #fff9d6;
  border-color: rgba(255, 209, 102, 0.8);
  box-shadow: 0 0 24px rgba(255, 209, 102, 0.35), 0 8px 26px rgba(0, 0, 0, 0.45);
}

@keyframes toast-in {
  from { transform: translateY(8px) scale(0.94); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

#touch-controls {
  z-index: 5;
}

#joystick-zone {
  pointer-events: auto;
  position: absolute;
  left: max(18px, env(safe-area-inset-left));
  bottom: max(16px, env(safe-area-inset-bottom));
  width: min(42vw, 220px);
  height: min(42vw, 220px);
}

#joystick-base {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 132px;
  height: 132px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 3px solid rgba(255, 236, 199, 0.22);
  background: radial-gradient(circle, rgba(255, 255, 255, 0.12), rgba(21, 9, 34, 0.62));
  box-shadow: inset 0 0 24px rgba(0, 0, 0, 0.5), 0 10px 30px rgba(0, 0, 0, 0.28);
}

#joystick-knob {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 56px;
  height: 56px;
  transform: translate(-50%, -50%);
  border-radius: 50%;
  border: 3px solid #0b0612;
  background: linear-gradient(#ffecb8, #f77f8e 48%, #953153);
  box-shadow: 0 5px 0 #060309, 0 0 22px rgba(255, 49, 95, 0.34);
}

#button-pad {
  pointer-events: auto;
  position: absolute;
  right: max(12px, env(safe-area-inset-right));
  bottom: max(12px, env(safe-area-inset-bottom));
  width: min(48vw, 315px);
  height: 205px;
}

.game-button {
  position: absolute;
  display: grid;
  place-items: center;
  grid-template-rows: 1fr auto;
  border: 3px solid #07040b;
  border-radius: 50%;
  color: #fff7df;
  text-shadow: 0 2px 0 #000;
  font-weight: 950;
  letter-spacing: 0.02em;
  box-shadow: 0 5px 0 #050309, 0 10px 28px rgba(0, 0, 0, 0.38), inset 0 1px 0 rgba(255, 255, 255, 0.22);
  overflow: hidden;
}

.game-button span {
  pointer-events: none;
  align-self: end;
}

.game-button small {
  pointer-events: none;
  align-self: start;
  color: rgba(255, 255, 255, 0.78);
  font-size: 9px;
  font-weight: 900;
  letter-spacing: 0.06em;
}

.game-button.cooling {
  filter: grayscale(0.25) brightness(0.72);
}

.game-button.disabled {
  opacity: 0.52;
}

.light-button {
  right: 72px;
  bottom: 44px;
  width: 84px;
  height: 84px;
  background: radial-gradient(circle at 35% 28%, #fff2ba, #ff395f 55%, #8d1236 100%);
}

.heavy-button {
  right: 153px;
  bottom: 82px;
  width: 73px;
  height: 73px;
  background: radial-gradient(circle at 35% 28%, #ffe8a3, #fb8500 55%, #6f2d00 100%);
}

.special-button {
  right: 12px;
  bottom: 106px;
  width: 78px;
  height: 78px;
  background: radial-gradient(circle at 35% 28%, #f7d9ff, #8f4dff 55%, #32105b 100%);
}

.block-button {
  right: 176px;
  bottom: 8px;
  width: 74px;
  height: 74px;
  background: radial-gradient(circle at 35% 28%, #d7fbff, #278ac7 55%, #13364c 100%);
}

.dash-button {
  right: 6px;
  bottom: 14px;
  width: 67px;
  height: 67px;
  background: radial-gradient(circle at 35% 28%, #c7fff6, #18c4a7 55%, #0a4b44 100%);
}

.interact-button {
  right: 242px;
  bottom: 66px;
  width: 66px;
  height: 66px;
  background: radial-gradient(circle at 35% 28%, #fff0b8, #ffd166 55%, #7d4c06 100%);
}

#modal-backdrop {
  display: grid;
  place-items: center;
  padding: max(12px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
  z-index: 20;
  background: rgba(5, 2, 10, 0.56);
  backdrop-filter: blur(5px);
  pointer-events: auto;
}

#modal-card {
  width: min(680px, 94vw);
  max-height: min(86vh, 760px);
  overflow: auto;
  touch-action: pan-y;
  border: 3px solid rgba(255, 236, 199, 0.22);
  border-radius: 24px;
  background: linear-gradient(145deg, rgba(36, 16, 58, 0.98), rgba(21, 9, 34, 0.98));
  color: var(--cream);
  box-shadow: 0 22px 80px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.06);
}

.modal-header {
  position: sticky;
  top: 0;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 18px 18px 10px;
  background: linear-gradient(rgba(36, 16, 58, 0.98), rgba(36, 16, 58, 0.9));
}

#modal-title {
  margin: 0;
  font-size: 22px;
  text-shadow: 0 2px 0 #000;
}

#modal-close {
  font-size: 26px;
  line-height: 1;
  min-width: 42px;
  min-height: 38px;
}

#modal-body {
  padding: 10px 18px 12px;
  line-height: 1.45;
  touch-action: pan-y;
}

#modal-body * {
  touch-action: pan-y;
}

#modal-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  padding: 0 18px 18px;
}

.modal-button,
.choice-card {
  pointer-events: auto;
  touch-action: manipulation;
  border: 2px solid rgba(255, 255, 255, 0.15);
  border-radius: 16px;
  padding: 12px 14px;
  color: var(--cream);
  background: linear-gradient(#603a7f, #301948);
  box-shadow: 0 4px 0 #08040d, 0 8px 18px rgba(0, 0, 0, 0.32);
  font-weight: 850;
  text-align: left;
}

.modal-button.primary {
  background: linear-gradient(#ff596f, #8d1236);
}

.modal-button.good {
  background: linear-gradient(#43c466, #186d36);
}

.modal-button.warn {
  background: linear-gradient(#ffb703, #8a4d00);
}

.modal-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px;
}

.card-list {
  display: grid;
  gap: 10px;
}

.info-card,
.weapon-card,
.resource-card {
  padding: 12px;
  border-radius: 16px;
  border: 2px solid rgba(255, 255, 255, 0.12);
  background: rgba(255, 255, 255, 0.055);
}

.weapon-card.equipped {
  border-color: rgba(255, 209, 102, 0.75);
  box-shadow: 0 0 18px rgba(255, 209, 102, 0.16);
}

.pill {
  display: inline-block;
  padding: 2px 8px;
  margin: 2px 3px 2px 0;
  border-radius: 999px;
  color: white;
  background: rgba(255, 255, 255, 0.12);
  font-size: 12px;
  font-weight: 800;
}

.cost-ok { color: #a5ff9b; }
.cost-missing { color: #ff9bb0; }

.hidden {
  display: none !important;
}

#orientation-tip {
  inset: auto 10px calc(8px + env(safe-area-inset-bottom)) 10px;
  display: none;
  text-align: center;
  color: rgba(255, 236, 199, 0.7);
  font-size: 11px;
  text-shadow: 0 1px 0 #000;
}

@media (orientation: portrait) and (max-width: 740px) {
  #orientation-tip {
    display: block;
  }

  #top-left-hud {
    width: calc(100vw - 130px);
  }

  #enemy-card {
    top: 118px;
    width: min(360px, 82vw);
  }

  #top-right-hud {
    transform: scale(0.88);
    transform-origin: top right;
  }

  #combo-strip {
    display: none;
  }

  #ability-row {
    top: 118px;
    max-width: 86vw;
  }

  #joystick-zone {
    width: 45vw;
    height: 45vw;
  }

  #button-pad {
    width: 52vw;
    transform: scale(0.88);
    transform-origin: bottom right;
  }
}

@media (max-height: 520px) {
  #top-left-hud {
    transform: scale(0.82);
    transform-origin: top left;
  }

  #top-right-hud {
    transform: scale(0.8);
    transform-origin: top right;
  }

  #combo-strip,
  #notifications {
    transform: translateX(-50%) scale(0.88);
  }

  #joystick-zone {
    transform: scale(0.88);
    transform-origin: bottom left;
  }

  #button-pad {
    transform: scale(0.88);
    transform-origin: bottom right;
  }
}

    </style>
  </head>
  <body>
<main id="game-shell" aria-label="Dager Hunter playable game">
      <canvas id="game-canvas" aria-label="Game view"></canvas>

      <section id="hud" aria-label="Heads up display">
        <div id="top-left-hud" class="hud-panel">
          <div class="brand-row">
            <span class="brand-mark">☾</span>
            <div>
              <strong>Dager Hunter</strong>
              <small id="mode-label">Base</small>
            </div>
          </div>
          <div class="bar-wrap health-wrap" aria-label="Health">
            <div id="health-bar" class="bar-fill"></div>
            <span id="health-text" class="bar-text">HP</span>
          </div>
          <div class="bar-wrap xp-wrap" aria-label="Experience">
            <div id="xp-bar" class="bar-fill"></div>
            <span id="xp-text" class="bar-text">LV 1</span>
          </div>
          <div id="currency-line" class="stat-line">Coins 0</div>
          <div id="run-loot-line" class="stat-line muted">Run loot: none</div>
        </div>

        <div id="top-right-hud" class="hud-panel">
          <button id="pause-button" class="hud-button" type="button" aria-label="Pause game">☰</button>
          <canvas id="minimap" width="156" height="104" aria-label="Minimap"></canvas>
        </div>

        <div id="enemy-card" class="hud-panel hidden" aria-label="Target enemy">
          <div class="enemy-title-row">
            <strong id="enemy-name">Enemy</strong>
            <span id="enemy-bleed-pill">Bleed 0</span>
          </div>
          <div class="bar-wrap enemy-wrap">
            <div id="enemy-health-bar" class="bar-fill"></div>
          </div>
        </div>

        <div id="combo-strip" class="hud-panel">
          <span id="combo-label">Combo: Light → Light → Heavy → Special</span>
        </div>

        <div id="ability-row" aria-label="Temporary run abilities"></div>
        <div id="notifications" aria-live="polite"></div>
      </section>

      <section id="touch-controls" aria-label="Touch controls">
        <div id="joystick-zone" aria-label="Movement joystick">
          <div id="joystick-base">
            <div id="joystick-knob"></div>
          </div>
        </div>

        <div id="button-pad" aria-label="Combat buttons">
          <button class="game-button block-button" data-action="block" type="button">
            <span>BLOCK</span><small>PARRY</small>
          </button>
          <button class="game-button special-button" data-action="special" type="button">
            <span>SPECIAL</span><small id="special-cd">READY</small>
          </button>
          <button class="game-button heavy-button" data-action="heavy" type="button">
            <span>HEAVY</span><small>FINISH</small>
          </button>
          <button class="game-button light-button" data-action="light" type="button">
            <span>LIGHT</span><small>COMBO</small>
          </button>
          <button class="game-button dash-button" data-action="dash" type="button">
            <span>DASH</span><small id="dash-cd">READY</small>
          </button>
          <button class="game-button interact-button" data-action="interact" type="button">
            <span id="interact-label">ACT</span><small id="interact-hint">—</small>
          </button>
        </div>
      </section>

      <section id="modal-backdrop" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div id="modal-card">
          <div class="modal-header">
            <h2 id="modal-title">Menu</h2>
            <button id="modal-close" type="button" aria-label="Close menu">×</button>
          </div>
          <div id="modal-body"></div>
          <div id="modal-actions"></div>
        </div>
      </section>

      <div id="orientation-tip">Rotate to landscape for the roomiest combat view.</div>
    </main>

    <noscript>Dager Hunter requires JavaScript to run.</noscript>
    <script>
window.__DAGER_HUNTER_SINGLE_FILE__ = true;
(function () {
'use strict';
// Begin src/core/utils.js
const TAU = Math.PI * 2;

function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function inverseLerp(a, b, v) {
  if (a === b) return 0;
  return clamp((v - a) / (b - a), 0, 1);
}

function smoothstep(t) {
  t = clamp(t, 0, 1);
  return t * t * (3 - 2 * t);
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function distanceSq(a, b) {
  const dx = a.x - b.x;
  const dy = a.y - b.y;
  return dx * dx + dy * dy;
}

function angleTo(a, b) {
  return Math.atan2(b.y - a.y, b.x - a.x);
}

function angleDiff(a, b) {
  let d = ((a - b + Math.PI) % TAU) - Math.PI;
  if (d < -Math.PI) d += TAU;
  return d;
}

function normalize(x, y) {
  const len = Math.hypot(x, y);
  if (len <= 0.0001) return { x: 0, y: 0, len: 0 };
  return { x: x / len, y: y / len, len };
}

function pointInRect(p, r) {
  return p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;
}

function circleRectOverlap(cx, cy, cr, rect) {
  const nearestX = clamp(cx, rect.x, rect.x + rect.w);
  const nearestY = clamp(cy, rect.y, rect.y + rect.h);
  const dx = cx - nearestX;
  const dy = cy - nearestY;
  return dx * dx + dy * dy <= cr * cr;
}

function distanceToSegment(px, py, ax, ay, bx, by) {
  const vx = bx - ax;
  const vy = by - ay;
  const wx = px - ax;
  const wy = py - ay;
  const c1 = vx * wx + vy * wy;
  if (c1 <= 0) return Math.hypot(px - ax, py - ay);
  const c2 = vx * vx + vy * vy;
  if (c2 <= c1) return Math.hypot(px - bx, py - by);
  const t = c1 / c2;
  const projX = ax + t * vx;
  const projY = ay + t * vy;
  return Math.hypot(px - projX, py - projY);
}

function lineCircleDistance(ax, ay, bx, by, cx, cy) {
  return distanceToSegment(cx, cy, ax, ay, bx, by);
}

function rgba(hex, alpha) {
  const value = hex.replace('#', '');
  const bigint = Number.parseInt(value.length === 3 ? value.split('').map((v) => v + v).join('') : value, 16);
  const r = (bigint >> 16) & 255;
  const g = (bigint >> 8) & 255;
  const b = bigint & 255;
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function formatResources(resources, names = {}) {
  const entries = Object.entries(resources || {}).filter(([, qty]) => qty > 0);
  if (!entries.length) return 'none';
  return entries
    .map(([id, qty]) => `${names[id] || id.replace(/_/g, ' ')} ×${qty}`)
    .join(', ');
}

function hashString(input) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < input.length; i += 1) {
    h ^= input.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

class RNG {
  constructor(seed = Date.now()) {
    this.seed = typeof seed === 'string' ? hashString(seed) : seed >>> 0;
    if (this.seed === 0) this.seed = 0x9e3779b9;
  }

  next() {
    // Mulberry32: tiny, deterministic, good enough for procedural MVP layouts.
    let t = (this.seed += 0x6d2b79f5);
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }

  range(min, max) {
    return min + (max - min) * this.next();
  }

  int(min, maxInclusive) {
    return Math.floor(this.range(min, maxInclusive + 1));
  }

  chance(probability) {
    return this.next() < probability;
  }

  pick(list) {
    return list[Math.floor(this.next() * list.length)];
  }

  shuffle(list) {
    const result = [...list];
    for (let i = result.length - 1; i > 0; i -= 1) {
      const j = Math.floor(this.next() * (i + 1));
      [result[i], result[j]] = [result[j], result[i]];
    }
    return result;
  }

  weighted(entries) {
    const total = entries.reduce((sum, entry) => sum + entry.weight, 0);
    let roll = this.range(0, total);
    for (const entry of entries) {
      roll -= entry.weight;
      if (roll <= 0) return entry.value;
    }
    return entries.length ? entries[entries.length - 1].value : undefined;
  }
}

function drawOutlinedText(ctx, text, x, y, options = {}) {
  const {
    align = 'center',
    color = '#ffecc7',
    outline = '#08040d',
    size = 16,
    font = '900 16px system-ui',
    width = 5
  } = options;
  ctx.save();
  ctx.font = font.replace('16px', `${size}px`);
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  ctx.lineWidth = width;
  ctx.strokeStyle = outline;
  ctx.fillStyle = color;
  ctx.strokeText(text, x, y);
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawRoundedRect(ctx, x, y, w, h, r) {
  const radius = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  ctx.beginPath();
  ctx.moveTo(x + radius, y);
  ctx.arcTo(x + w, y, x + w, y + h, radius);
  ctx.arcTo(x + w, y + h, x, y + h, radius);
  ctx.arcTo(x, y + h, x, y, radius);
  ctx.arcTo(x, y, x + w, y, radius);
  ctx.closePath();
}

        introSeen: false
      }
    }
  };
}

function isPlainObject(value) {
  return value !== null && typeof value === 'object' && !Array.isArray(value);
}

function mergeDefaults(defaultValue, savedValue) {
  if (Array.isArray(defaultValue)) {
    return Array.isArray(savedValue) ? savedValue : [...defaultValue];
  }
  if (isPlainObject(defaultValue)) {
    const out = { ...defaultValue };
    if (isPlainObject(savedValue)) {
      for (const [key, value] of Object.entries(savedValue)) {
        out[key] = key in defaultValue ? mergeDefaults(defaultValue[key], value) : value;
      }
    }
    return out;
  }
  return savedValue === undefined ? defaultValue : savedValue;
}

class SaveSystem {
  constructor() {
    this.storageKey = STORAGE_KEY;
    this.data = this.load();
  }

  load() {
    const fallback = createDefaultSave();
    try {
      const raw = window.localStorage.getItem(this.storageKey);
      if (!raw) return fallback;
      const parsed = JSON.parse(raw);
      return mergeDefaults(fallback, parsed);
    } catch (error) {
      console.warn('Could not load save; using defaults.', error);
      return fallback;
    }
  }

  save() {
    this.data.updatedAt = Date.now();
    window.localStorage.setItem(this.storageKey, JSON.stringify(this.data));
  }

  reset() {
    this.data = createDefaultSave();
    this.save();
  }

  export() {
    return JSON.stringify(this.data, null, 2);
  }

  import(json) {
    const parsed = JSON.parse(json);
    this.data = mergeDefaults(createDefaultSave(), parsed);
    this.save();
  }
}

class AudioManager {
  constructor() {
    this.ctx = null;
    this.master = null;
    this.ambientGain = null;
    this.enabled = true;
    this.unlocked = false;
  }

  async unlock() {
    if (this.unlocked || !this.enabled) return;
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) {
      this.enabled = false;
      return;
    }
    this.ctx = new AudioContext();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.55;
    this.master.connect(this.ctx.destination);
    if (this.ctx.state === 'suspended') await this.ctx.resume();
    this.unlocked = true;
    this.startAmbient();
  }

  setMuted(muted) {
    this.enabled = !muted;
    if (this.master) this.master.gain.value = muted ? 0 : 0.55;
  }

  now() {
    return this.ctx ? this.ctx.currentTime : 0;
  }

  tone({ frequency = 440, duration = 0.08, type = 'sine', gain = 0.12, start = 0, endFrequency = null, pan = 0 } = {}) {
    if (!this.unlocked || !this.enabled) return;
    const t = this.now() + start;
    const osc = this.ctx.createOscillator();
    const amp = this.ctx.createGain();
    const stereo = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    osc.type = type;
    osc.frequency.setValueAtTime(frequency, t);
    if (endFrequency) osc.frequency.exponentialRampToValueAtTime(Math.max(20, endFrequency), t + duration);
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.exponentialRampToValueAtTime(gain, t + 0.01);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    if (stereo) {
      stereo.pan.value = pan;
      osc.connect(amp).connect(stereo).connect(this.master);
    } else {
      osc.connect(amp).connect(this.master);
    }
    osc.start(t);
    osc.stop(t + duration + 0.02);
  }

  noise({ duration = 0.08, gain = 0.1, start = 0, filter = 1400, pan = 0 } = {}) {
    if (!this.unlocked || !this.enabled) return;
    const t = this.now() + start;
    const bufferSize = Math.max(1, Math.floor(this.ctx.sampleRate * duration));
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i += 1) {
      data[i] = Math.random() * 2 - 1;
    }
    const source = this.ctx.createBufferSource();
    source.buffer = buffer;
    const amp = this.ctx.createGain();
    const biquad = this.ctx.createBiquadFilter();
    const stereo = this.ctx.createStereoPanner ? this.ctx.createStereoPanner() : null;
    biquad.type = 'bandpass';
    biquad.frequency.value = filter;
    biquad.Q.value = 0.8;
    amp.gain.setValueAtTime(0.0001, t);
    amp.gain.exponentialRampToValueAtTime(gain, t + 0.008);
    amp.gain.exponentialRampToValueAtTime(0.0001, t + duration);
    if (stereo) {
      stereo.pan.value = pan;
      source.connect(biquad).connect(amp).connect(stereo).connect(this.master);
    } else {
      source.connect(biquad).connect(amp).connect(this.master);
    }
    source.start(t);
    source.stop(t + duration + 0.02);
  }

  play(name, intensity = 1) {
    if (!this.unlocked || !this.enabled) return;
    const gain = Math.min(1.6, Math.max(0.35, intensity));
    switch (name) {
      case 'light':
        this.noise({ duration: 0.055, gain: 0.055 * gain, filter: 2300 });
        this.tone({ frequency: 640, endFrequency: 300, type: 'triangle', duration: 0.07, gain: 0.035 * gain });
        break;
      case 'heavy':
        this.noise({ duration: 0.08, gain: 0.08 * gain, filter: 1300 });
        this.tone({ frequency: 190, endFrequency: 90, type: 'sawtooth', duration: 0.12, gain: 0.05 * gain });
        break;
      case 'hit':
        this.noise({ duration: 0.065, gain: 0.08 * gain, filter: 900 });
        this.tone({ frequency: 130, endFrequency: 80, type: 'square', duration: 0.055, gain: 0.035 * gain });
        break;
      case 'crit':
        this.tone({ frequency: 840, endFrequency: 520, type: 'triangle', duration: 0.1, gain: 0.07 * gain });
        this.tone({ frequency: 1280, endFrequency: 720, type: 'sine', duration: 0.09, gain: 0.04 * gain, start: 0.02 });
        break;
      case 'parry':
        this.noise({ duration: 0.12, gain: 0.13 * gain, filter: 4200 });
        this.tone({ frequency: 1500, endFrequency: 460, type: 'sine', duration: 0.18, gain: 0.11 * gain });
        this.tone({ frequency: 95, endFrequency: 55, type: 'sawtooth', duration: 0.18, gain: 0.08 * gain });
        break;
      case 'block':
        this.noise({ duration: 0.07, gain: 0.065 * gain, filter: 600 });
        this.tone({ frequency: 260, endFrequency: 170, type: 'triangle', duration: 0.08, gain: 0.035 * gain });
        break;
      case 'dash':
        this.noise({ duration: 0.13, gain: 0.07 * gain, filter: 3200 });
        this.tone({ frequency: 500, endFrequency: 210, type: 'sine', duration: 0.12, gain: 0.035 * gain });
        break;
      case 'special':
        this.tone({ frequency: 180, endFrequency: 80, type: 'sawtooth', duration: 0.22, gain: 0.08 * gain });
        this.noise({ duration: 0.18, gain: 0.09 * gain, filter: 1800, start: 0.04 });
        this.tone({ frequency: 770, endFrequency: 1130, type: 'triangle', duration: 0.16, gain: 0.06 * gain, start: 0.06 });
        break;
      case 'loot':
        this.tone({ frequency: 700, type: 'triangle', duration: 0.08, gain: 0.05 * gain });
        this.tone({ frequency: 1040, type: 'sine', duration: 0.11, gain: 0.04 * gain, start: 0.06 });
        break;
      case 'ui':
        this.tone({ frequency: 360, endFrequency: 520, type: 'triangle', duration: 0.07, gain: 0.04 * gain });
        break;
      case 'enemy':
        this.tone({ frequency: 110, endFrequency: 70, type: 'sawtooth', duration: 0.14, gain: 0.055 * gain });
        break;
      case 'death':
        this.tone({ frequency: 150, endFrequency: 40, type: 'sawtooth', duration: 0.6, gain: 0.08 * gain });
        this.noise({ duration: 0.35, gain: 0.08 * gain, filter: 300 });
        break;
      default:
        this.tone({ frequency: 440, duration: 0.05, gain: 0.03 * gain });
    }
  }

  startAmbient() {
    if (!this.unlocked || this.ambientGain) return;
    this.ambientGain = this.ctx.createGain();
    this.ambientGain.gain.value = 0.035;
    this.ambientGain.connect(this.master);

    const oscA = this.ctx.createOscillator();
    const oscB = this.ctx.createOscillator();
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 360;
    oscA.type = 'sine';
    oscB.type = 'triangle';
    oscA.frequency.value = 58;
    oscB.frequency.value = 87;
    oscA.connect(filter);
    oscB.connect(filter);
    filter.connect(this.ambientGain);
    oscA.start();
    oscB.start();

    // Slow gain pulse for fantasy ambience without streaming audio assets.
    const pulse = () => {
      if (!this.ctx || !this.ambientGain) return;
      const t = this.now();
      this.ambientGain.gain.cancelScheduledValues(t);
      this.ambientGain.gain.setValueAtTime(this.ambientGain.gain.value, t);
      this.ambientGain.gain.linearRampToValueAtTime(0.018 + Math.random() * 0.025, t + 3 + Math.random() * 2);
      window.setTimeout(pulse, 3000 + Math.random() * 2000);
    };
    pulse();
  }
}

// Begin src/core/input.js
const ACTIONS = ['light', 'heavy', 'special', 'block', 'dash', 'interact', 'pause'];

class InputManager {
  constructor({ onFirstInput } = {}) {
    this.onFirstInput = onFirstInput;
    this.firstInputSent = false;
    this.move = { x: 0, y: 0, strength: 0 };
    this.actions = {};
    ACTIONS.forEach((action) => {
      this.actions[action] = { down: false, presses: 0, releases: 0 };
    });
    this.keys = new Set();
    this.joystickPointerId = null;
    this.joystickCenter = { x: 0, y: 0 };
    this.joystickRadius = 58;
    this.setupDomControls();
    this.setupKeyboard();
    window.addEventListener('contextmenu', (event) => event.preventDefault());
  }

  setupDomControls() {
    this.zone = document.getElementById('joystick-zone');
    this.knob = document.getElementById('joystick-knob');
    if (this.zone) {
      this.zone.addEventListener('pointerdown', (event) => {
        this.unlockOnce();
        this.joystickPointerId = event.pointerId;
        this.zone.setPointerCapture(event.pointerId);
        const rect = this.zone.getBoundingClientRect();
        this.joystickCenter.x = rect.left + rect.width / 2;
        this.joystickCenter.y = rect.top + rect.height / 2;
        this.updateJoystick(event.clientX, event.clientY);
      });
      this.zone.addEventListener('pointermove', (event) => {
        if (event.pointerId !== this.joystickPointerId) return;
        this.updateJoystick(event.clientX, event.clientY);
      });
      const end = (event) => {
        if (event.pointerId !== this.joystickPointerId) return;
        this.joystickPointerId = null;
        this.move.x = 0;
        this.move.y = 0;
        this.move.strength = 0;
        this.updateKnob(0, 0);
      };
      this.zone.addEventListener('pointerup', end);
      this.zone.addEventListener('pointercancel', end);
    }

    document.querySelectorAll('[data-action]').forEach((button) => {
      const action = button.dataset.action;
      if (!this.actions[action]) return;
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        this.unlockOnce();
        button.setPointerCapture(event.pointerId);
        this.setAction(action, true);
      });
      const release = (event) => {
        event.preventDefault();
        this.setAction(action, false);
      };
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', () => this.setAction(action, false));
    });
  }

  setupKeyboard() {
    window.addEventListener('keydown', (event) => {
      this.unlockOnce();
      if (event.repeat) return;
      const mapped = this.mapKey(event.code);
      if (mapped) {
        event.preventDefault();
        this.setAction(mapped, true);
      }
      this.keys.add(event.code);
      this.updateKeyboardMove();
    });
    window.addEventListener('keyup', (event) => {
      const mapped = this.mapKey(event.code);
      if (mapped) {
        event.preventDefault();
        this.setAction(mapped, false);
      }
      this.keys.delete(event.code);
      this.updateKeyboardMove();
    });
    window.addEventListener('blur', () => {
      for (const action of ACTIONS) this.setAction(action, false);
      this.keys.clear();
      this.updateKeyboardMove();
    });
  }

  mapKey(code) {
    switch (code) {
      case 'KeyJ':
      case 'Numpad1':
        return 'light';
      case 'KeyK':
      case 'Numpad2':
        return 'heavy';
      case 'KeyL':
      case 'Numpad3':
        return 'special';
      case 'ShiftLeft':
      case 'ShiftRight':
        return 'block';
      case 'Space':
        return 'dash';
      case 'KeyE':
      case 'Enter':
        return 'interact';
      case 'Escape':
      case 'KeyP':
        return 'pause';
      default:
        return null;
    }
  }

  updateKeyboardMove() {
    let x = 0;
    let y = 0;
    if (this.keys.has('KeyA') || this.keys.has('ArrowLeft')) x -= 1;
    if (this.keys.has('KeyD') || this.keys.has('ArrowRight')) x += 1;
    if (this.keys.has('KeyW') || this.keys.has('ArrowUp')) y -= 1;
    if (this.keys.has('KeyS') || this.keys.has('ArrowDown')) y += 1;
    if (x !== 0 || y !== 0) {
      const length = Math.hypot(x, y);
      this.move.x = x / length;
      this.move.y = y / length;
      this.move.strength = 1;
    } else if (this.joystickPointerId === null) {
      this.move.x = 0;
      this.move.y = 0;
      this.move.strength = 0;
    }
  }

  unlockOnce() {
    if (this.firstInputSent) return;
    this.firstInputSent = true;
    if (this.onFirstInput) this.onFirstInput();
  }

  updateJoystick(clientX, clientY) {
    const dx = clientX - this.joystickCenter.x;
    const dy = clientY - this.joystickCenter.y;
    const length = Math.hypot(dx, dy);
    const clamped = Math.min(length, this.joystickRadius);
    const nx = length > 0 ? dx / length : 0;
    const ny = length > 0 ? dy / length : 0;
    this.move.x = nx;
    this.move.y = ny;
    this.move.strength = clamped / this.joystickRadius;
    this.updateKnob(nx * clamped, ny * clamped);
  }

  updateKnob(x, y) {
    if (!this.knob) return;
    this.knob.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px))`;
  }

  setAction(action, down) {
    const state = this.actions[action];
    if (!state) return;
    if (down && !state.down) state.presses += 1;
    if (!down && state.down) state.releases += 1;
    state.down = down;
  }

  consume(action) {
    const state = this.actions[action];
    if (!state || state.presses <= 0) return false;
    state.presses -= 1;
    return true;
  }

  isDown(action) {
    return Boolean(this.actions[action] && this.actions[action].down);
  }

  endFrame() {
    for (const action of ACTIONS) {
      this.actions[action].presses = 0;
      this.actions[action].releases = 0;
    }
  }
}

function resolveCircleRect(entity, rect) {
  const nearestX = clamp(entity.x, rect.x, rect.x + rect.w);
  const nearestY = clamp(entity.y, rect.y, rect.y + rect.h);
  let dx = entity.x - nearestX;
  let dy = entity.y - nearestY;
  let dist = Math.hypot(dx, dy);
  if (dist > entity.radius || dist <= 0.0001) {
    if (dist > entity.radius) return;
    const left = Math.abs(entity.x - rect.x);
    const right = Math.abs(rect.x + rect.w - entity.x);
    const top = Math.abs(entity.y - rect.y);
    const bottom = Math.abs(rect.y + rect.h - entity.y);
    const min = Math.min(left, right, top, bottom);
    if (min === left) {
      dx = -1;
      dy = 0;
      dist = 0;
    } else if (min === right) {
      dx = 1;
      dy = 0;
      dist = 0;
    } else if (min === top) {
      dx = 0;
      dy = -1;
      dist = 0;
    } else {
      dx = 0;
      dy = 1;
      dist = 0;
    }
  }
  const push = entity.radius - dist + 0.01;
  const nx = dist > 0 ? dx / dist : dx;
  const ny = dist > 0 ? dy / dist : dy;
  entity.x += nx * push;
  entity.y += ny * push;
}

function resolveCircleObstacle(entity, obstacle) {
  const dx = entity.x - obstacle.x;
  const dy = entity.y - obstacle.y;
  const minDistance = entity.radius + obstacle.r;
  const dist = Math.hypot(dx, dy);
  if (dist >= minDistance || dist <= 0.0001) return;
  const push = minDistance - dist + 0.01;
  entity.x += (dx / dist) * push;
  entity.y += (dy / dist) * push;
}

      const cx = building.x + building.w / 2;
      const cy = building.y + building.h / 2;
      const d = Math.hypot(player.x - cx, player.y - cy);
      if (d < building.radius && d < bestD) {
        best = building;
        bestD = d;
      }
    }
    return best;
  }

  draw(ctx, game) {
    ctx.save();
    ctx.fillStyle = '#294c35';
    ctx.fillRect(0, 0, this.width, this.height);

    // Comic-style boundary forest.
    for (let i = 0; i < 34; i += 1) {
      const x = (i * 137) % this.width;
      const y = i % 2 === 0 ? 50 + ((i * 53) % 140) : this.height - 80 - ((i * 47) % 150);
      this.drawTree(ctx, x, y, 36 + (i % 5) * 5, i % 3 === 0);
    }

    // Main base paths.
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = '#17101f';
    ctx.lineWidth = 78;
    ctx.beginPath();
    ctx.moveTo(this.start.x, this.start.y);
    for (const b of this.buildings) {
      ctx.moveTo(this.start.x, this.start.y);
      ctx.lineTo(b.x + b.w / 2, b.y + b.h / 2);
    }
    ctx.stroke();
    ctx.strokeStyle = '#8b7645';
    ctx.lineWidth = 58;
    ctx.stroke();
    ctx.strokeStyle = '#b9965a';
    ctx.lineWidth = 5;
    ctx.setLineDash([18, 18]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Training ring.
    ctx.save();
    ctx.strokeStyle = '#ffecc7';
    ctx.fillStyle = 'rgba(255, 209, 102, 0.08)';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.ellipse(830, 972, 174, 96, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    drawOutlinedText(ctx, 'TRAINING', 830, 973, { size: 18, color: '#ffecc7' });
    ctx.restore();

    // Buildings.
    for (const building of this.buildings) this.drawBuilding(ctx, building, game);

    // Obstacles after paths for silhouettes.
    for (const obstacle of this.obstacles) {
      if (obstacle.type === 'tree') this.drawTree(ctx, obstacle.x, obstacle.y, obstacle.r, true);
      else this.drawRock(ctx, obstacle.x, obstacle.y, obstacle.r);
    }

    drawOutlinedText(ctx, 'Blood Hunter Base', this.start.x, this.start.y - 82, { size: 24, color: '#ffd166' });
    drawOutlinedText(ctx, 'Something is corrupting the world. Hunt monsters and discover why.', this.start.x, this.start.y - 52, {
      size: 13,
      color: '#ffecc7',
      width: 4
    });
    ctx.restore();
  }

  drawBuilding(ctx, building, game) {
    const cx = building.x + building.w / 2;
    const cy = building.y + building.h / 2;
    const active = Math.hypot(game.player.x - cx, game.player.y - cy) < building.radius;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.38)';
    ctx.shadowBlur = 16;
    ctx.shadowOffsetY = 10;
    ctx.fillStyle = active ? 'rgba(255,209,102,0.18)' : 'rgba(0,0,0,0.1)';
    ctx.beginPath();
    ctx.ellipse(cx, building.y + building.h + 16, building.w * 0.6, 28, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowColor = 'transparent';

    drawRoundedRect(ctx, building.x, building.y + 35, building.w, building.h - 35, 16);
    ctx.fillStyle = building.color;
    ctx.fill();
    ctx.lineWidth = 5;
    ctx.strokeStyle = '#0a0610';
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(building.x - 18, building.y + 44);
    ctx.lineTo(cx, building.y - 14);
    ctx.lineTo(building.x + building.w + 18, building.y + 44);
    ctx.closePath();
    ctx.fillStyle = building.roof;
    ctx.fill();
    ctx.strokeStyle = '#0a0610';
    ctx.lineWidth = 6;
    ctx.stroke();

    if (building.id === 'world_map') {
      ctx.save();
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = active ? '#ffd166' : '#70e8ff';
      ctx.lineWidth = active ? 8 : 5;
      ctx.beginPath();
      ctx.arc(cx, cy, 66 + Math.sin(game.time * 3) * 4, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.arc(cx, cy, 30, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(112,232,255,0.22)';
      ctx.fill();
      ctx.restore();
    }

    ctx.fillStyle = '#ffecc7';
    ctx.strokeStyle = '#08040d';
    ctx.lineWidth = 5;
    ctx.font = '900 36px system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.strokeText(building.icon, cx, building.y + building.h / 2 + 20);
    ctx.fillText(building.icon, cx, building.y + building.h / 2 + 20);

    drawOutlinedText(ctx, building.label, cx, building.y + building.h + 32, {
      size: active ? 17 : 15,
      color: active ? '#ffd166' : '#ffecc7'
    });
    drawOutlinedText(ctx, building.subtitle, cx, building.y + building.h + 53, { size: 11, color: '#cbb7d9', width: 3 });
    ctx.restore();
  }

  drawTree(ctx, x, y, r, dark = false) {
    ctx.save();
    ctx.fillStyle = '#15100d';
    ctx.beginPath();
    drawRoundedRect(ctx, x - r * 0.15, y + r * 0.1, r * 0.3, r * 0.92, 8);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x, y, r * 0.88, r * 0.72, 0, 0, Math.PI * 2);
    ctx.fillStyle = dark ? '#1f5736' : '#2f7d48';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#0a0610';
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x - r * 0.22, y - r * 0.17, r * 0.32, r * 0.23, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = dark ? '#2d7444' : '#54a75d';
    ctx.fill();
    ctx.restore();
  }

  drawRock(ctx, x, y, r) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - r, y + r * 0.25);
    ctx.lineTo(x - r * 0.45, y - r * 0.7);
    ctx.lineTo(x + r * 0.42, y - r * 0.82);
    ctx.lineTo(x + r, y + r * 0.12);
    ctx.lineTo(x + r * 0.32, y + r * 0.78);
    ctx.closePath();
    ctx.fillStyle = '#6e7180';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#0a0610';
    ctx.stroke();
    ctx.restore();
  }
}

class ProceduralForest {
  constructor(seed = Date.now()) {
    this.kind = 'hunt';
    this.seed = seed;
    this.rng = new RNG(seed);
    this.width = 2700;
    this.height = 1900;
    this.boundsPadding = 26;
    this.rooms = [];
    this.corridors = [];
    this.obstacles = [];
    this.chests = [];
    this.shrines = [];
    this.exits = [];
    this.enemySpawns = [];
    this.miniBossId = null;
    this.generate();
  }

  getStartPosition() {
    return { x: this.start.x, y: this.start.y };
  }

  generate() {
    const rng = this.rng;
    const roomTypes = ['clearing', 'river', 'ruins', 'cave', 'mushroom_grove', 'fallen_tower'];
    const pathRooms = [];
    let y = rng.range(this.height * 0.35, this.height * 0.65);
    const count = 8;
    for (let i = 0; i < count; i += 1) {
      y = clamp(y + rng.range(-210, 210), 245, this.height - 245);
      const room = {
        id: `path-${i}`,
        x: 250 + i * 310 + rng.range(-44, 44),
        y,
        w: rng.range(230, 335) + i * 8,
        h: rng.range(175, 280),
        type: i === 0 ? 'hunter_camp' : i === count - 1 ? 'boss_grove' : rng.pick(roomTypes),
        criticalPath: true,
        secret: false,
        discovered: i === 0,
        danger: i / (count - 1)
      };
      pathRooms.push(room);
      this.rooms.push(room);
      if (i > 0) this.corridors.push({ a: pathRooms[i - 1], b: room, width: rng.range(100, 148) });
    }

    this.start = { x: pathRooms[0].x - 52, y: pathRooms[0].y };
    this.bossRoom = pathRooms[pathRooms.length - 1];
    this.boss = { x: this.bossRoom.x + 26, y: this.bossRoom.y };

    // Secret branches: visible if explored, always connected to avoid impossible layouts.
    const branchSourceIndexes = rng.shuffle([2, 3, 4, 5, 6]).slice(0, 3);
    for (const [branchIndex, sourceIndex] of branchSourceIndexes.entries()) {
      const source = pathRooms[sourceIndex];
      const sign = rng.chance(0.5) ? -1 : 1;
      const room = {
        id: `secret-${branchIndex}`,
        x: clamp(source.x + rng.range(-80, 150), 230, this.width - 230),
        y: clamp(source.y + sign * rng.range(285, 395), 230, this.height - 230),
        w: rng.range(210, 285),
        h: rng.range(160, 235),
        type: rng.pick(['hidden_cache', 'cave', 'ruins', 'shrine_grove']),
        criticalPath: false,
        secret: true,
        discovered: false,
        danger: sourceIndex / (count - 1) + 0.15
      };
      this.rooms.push(room);
      this.corridors.push({ a: source, b: room, width: rng.range(66, 92), secret: true });
    }

    this.generateInteractables();
    this.generateEnemySpawns();
    this.generateObstacles();
  }

  generateInteractables() {
    const rng = this.rng;
    for (const room of this.rooms) {
      if (room.type === 'hunter_camp' || room.type === 'boss_grove') continue;
      if (room.secret || rng.chance(0.54)) {
        this.chests.push({
          id: `chest-${this.chests.length}`,
          x: room.x + rng.range(-room.w * 0.26, room.w * 0.26),
          y: room.y + rng.range(-room.h * 0.25, room.h * 0.25),
          opened: false,
          hidden: room.secret || rng.chance(0.2),
          discovered: !room.secret && !rng.chance(0.2),
          dangerous: room.secret || rng.chance(0.18),
          roomId: room.id
        });
      }
      if (!room.secret && rng.chance(0.28)) {
        this.shrines.push({
          id: `shrine-${this.shrines.length}`,
          x: room.x + rng.range(-room.w * 0.22, room.w * 0.22),
          y: room.y + rng.range(-room.h * 0.22, room.h * 0.22),
          used: false,
          roomId: room.id
        });
      }
    }
    // Ensure at least one temporary ability source per hunt.
    if (!this.shrines.length) {
      const room = this.rooms.find((r) => r.id === 'path-3') || this.rooms[2];
      this.shrines.push({ id: 'shrine-guaranteed', x: room.x, y: room.y - room.h * 0.24, used: false, roomId: room.id });
    }

    this.exits.push({
      id: 'entry_exit',
      label: 'Return to Base',
      x: this.start.x - 42,
      y: this.start.y,
      r: 45,
      unlocked: true,
      discovered: true
    });
    this.exits.push({
      id: 'boss_exit',
      label: 'Escape Portal',
      x: this.boss.x + 105,
      y: this.boss.y,
      r: 50,
      unlocked: false,
      discovered: false
    });
  }

  generateEnemySpawns() {
    const rng = this.rng;
    const basicWeightsByDepth = (depth) => [
      { value: 'wolf', weight: 5 - depth * 1.5 },
      { value: 'goblin', weight: 4.4 },
      { value: 'goblin_archer', weight: 1.1 + depth * 2.2 },
      { value: 'mage', weight: Math.max(0.2, depth * 2.1) },
      { value: 'brute', weight: Math.max(0.15, depth * 1.7) }
    ];

    for (const room of this.rooms) {
      if (room.type === 'hunter_camp') continue;
      if (room.type === 'boss_grove') continue;
      const depth = clamp(room.danger !== undefined ? room.danger : 0.2, 0, 1);
      let count = room.secret ? rng.int(2, 4) : rng.int(1, 2 + Math.floor(depth * 3));
      if (room.secret) count += 1;
      for (let i = 0; i < count; i += 1) {
        const type = rng.weighted(basicWeightsByDepth(depth));
        this.enemySpawns.push({
          type,
          x: room.x + rng.range(-room.w * 0.32, room.w * 0.32),
          y: room.y + rng.range(-room.h * 0.32, room.h * 0.32),
          roomId: room.id,
          patrolRadius: Math.max(room.w, room.h) * 0.36
        });
      }
      if (room.secret && rng.chance(0.65)) {
        this.enemySpawns.push({
          type: rng.pick(['brute', 'mage']),
          x: room.x + rng.range(-room.w * 0.2, room.w * 0.2),
          y: room.y + rng.range(-room.h * 0.2, room.h * 0.2),
          roomId: room.id,
          patrolRadius: 120
        });
      }
    }

    this.miniBossId = rng.pick(Object.keys(MINI_BOSSES));
    this.enemySpawns.push({
      type: this.miniBossId,
      boss: true,
      x: this.boss.x,
      y: this.boss.y,
      roomId: this.bossRoom.id,
      patrolRadius: 220
    });
  }

  generateObstacles() {
    const rng = this.rng;
    const isSafe = (x, y, r) => {
      if (Math.hypot(x - this.start.x, y - this.start.y) < 150 + r) return false;
      for (const room of this.rooms) {
        const nx = Math.abs(x - room.x) / (room.w * 0.5 + r);
        const ny = Math.abs(y - room.y) / (room.h * 0.5 + r);
        // Keep inner encounter spaces mostly clear.
        if (nx * nx + ny * ny < 0.88) return false;
      }
      for (const c of this.corridors) {
        if (distanceToSegment(x, y, c.a.x, c.a.y, c.b.x, c.b.y) < c.width * 0.55 + r) return false;
      }
      return true;
    };

    let attempts = 0;
    while (this.obstacles.length < 210 && attempts < 2000) {
      attempts += 1;
      const x = rng.range(60, this.width - 60);
      const y = rng.range(60, this.height - 60);
      const r = rng.range(16, 42);
      if (isSafe(x, y, r)) {
        this.obstacles.push({ x, y, r, type: rng.chance(0.78) ? 'tree' : 'rock', hue: rng.range(-12, 12) });
      }
    }
  }

  markDiscovered(player, game) {
    for (const room of this.rooms) {
      if (room.discovered) continue;
      const nx = Math.abs(player.x - room.x) / (room.w * 0.62);
      const ny = Math.abs(player.y - room.y) / (room.h * 0.62);
      if (nx * nx + ny * ny < 1) {
        room.discovered = true;
        if (room.secret) {
          game.save.data.player.stats.secretsFound += 1;
          game.notify('Secret path discovered!', 'good');
        }
      }
    }
    for (const chest of this.chests) {
      if (!chest.discovered && Math.hypot(player.x - chest.x, player.y - chest.y) < 120) {
        chest.discovered = true;
        game.notify(chest.dangerous ? 'Dangerous hidden chest found!' : 'Hidden chest found!', chest.dangerous ? 'danger' : 'good');
      }
    }
  }

  unlockBossExit() {
    const exit = this.exits.find((e) => e.id === 'boss_exit');
    if (exit) {
      exit.unlocked = true;
      exit.discovered = true;
    }
  }

  resolveCollision(entity) {
    entity.x = clamp(entity.x, this.boundsPadding + entity.radius, this.width - this.boundsPadding - entity.radius);
    entity.y = clamp(entity.y, this.boundsPadding + entity.radius, this.height - this.boundsPadding - entity.radius);
    for (const obstacle of this.obstacles) resolveCircleObstacle(entity, obstacle);
  }

  nearestInteractive(player) {
    let best = null;
    let bestDistance = Infinity;
    for (const chest of this.chests) {
      if (chest.opened || !chest.discovered) continue;
      const d = Math.hypot(player.x - chest.x, player.y - chest.y);
      if (d < 82 && d < bestDistance) {
        best = { type: 'chest', label: chest.dangerous ? 'Open Risk Chest' : 'Open Chest', target: chest };
        bestDistance = d;
      }
    }
    for (const shrine of this.shrines) {
      if (shrine.used) continue;
      const d = Math.hypot(player.x - shrine.x, player.y - shrine.y);
      if (d < 90 && d < bestDistance) {
        best = { type: 'shrine', label: 'Choose Ability', target: shrine };
        bestDistance = d;
      }
    }
    for (const exit of this.exits) {
      if (!exit.unlocked || !exit.discovered) continue;
      const d = Math.hypot(player.x - exit.x, player.y - exit.y);
      if (d < exit.r + 42 && d < bestDistance) {
        best = { type: 'exit', label: exit.label, target: exit };
        bestDistance = d;
      }
    }
    return best;
  }

  draw(ctx, game) {
    ctx.save();
    ctx.fillStyle = '#1d3d2a';
    ctx.fillRect(0, 0, this.width, this.height);

    // Outer comic forest silhouettes.
    ctx.fillStyle = '#132719';
    ctx.fillRect(0, 0, this.width, 50);
    ctx.fillRect(0, this.height - 50, this.width, 50);
    ctx.fillRect(0, 0, 50, this.height);
    ctx.fillRect(this.width - 50, 0, 50, this.height);

    // Corridors first.
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    for (const corridor of this.corridors) {
      const alpha = corridor.secret && !corridor.b.discovered ? 0.42 : 1;
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.strokeStyle = '#0b0711';
      ctx.lineWidth = corridor.width + 14;
      ctx.beginPath();
      ctx.moveTo(corridor.a.x, corridor.a.y);
      const midX = (corridor.a.x + corridor.b.x) / 2;
      ctx.quadraticCurveTo(midX, corridor.a.y, corridor.b.x, corridor.b.y);
      ctx.stroke();
      ctx.strokeStyle = corridor.secret ? '#536a36' : '#6b7642';
      ctx.lineWidth = corridor.width;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(255, 236, 199, 0.13)';
      ctx.lineWidth = 3;
      ctx.setLineDash([20, 24]);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    for (const room of this.rooms) this.drawRoom(ctx, room, game);

    // Environmental obstacles.
    for (const obstacle of this.obstacles) {
      if (obstacle.type === 'tree') this.drawTree(ctx, obstacle.x, obstacle.y, obstacle.r, obstacle.hue);
      else this.drawRock(ctx, obstacle.x, obstacle.y, obstacle.r);
    }

    for (const exit of this.exits) this.drawExit(ctx, exit, game.time);
    for (const shrine of this.shrines) this.drawShrine(ctx, shrine, game.time);
    for (const chest of this.chests) this.drawChest(ctx, chest, game.time);
    ctx.restore();
  }

  drawRoom(ctx, room, game) {
    const hidden = room.secret && !room.discovered;
    ctx.save();
    ctx.globalAlpha = hidden ? 0.44 : 1;
    ctx.beginPath();
    ctx.ellipse(room.x, room.y, room.w * 0.52, room.h * 0.52, 0, 0, Math.PI * 2);
    ctx.fillStyle = room.type === 'boss_grove' ? '#42344c' : room.secret ? '#4a5b35' : '#61753d';
    ctx.fill();
    ctx.lineWidth = room.secret ? 5 : 3;
    ctx.strokeStyle = room.secret ? '#ffe066' : 'rgba(15, 8, 18, 0.7)';
    ctx.stroke();

    if (room.type === 'river') {
      ctx.save();
      ctx.clip();
      ctx.strokeStyle = '#19334f';
      ctx.lineWidth = 54;
      ctx.beginPath();
      ctx.moveTo(room.x - room.w * 0.55, room.y + room.h * 0.1);
      ctx.bezierCurveTo(room.x - 40, room.y - room.h * 0.4, room.x + 30, room.y + room.h * 0.45, room.x + room.w * 0.6, room.y - room.h * 0.12);
      ctx.stroke();
      ctx.strokeStyle = '#50b6d8';
      ctx.lineWidth = 38;
      ctx.stroke();
      ctx.restore();
    }

    if (room.type === 'ruins' || room.type === 'fallen_tower') {
      ctx.fillStyle = '#7d807d';
      ctx.strokeStyle = '#0a0610';
      ctx.lineWidth = 3;
      for (let i = 0; i < 4; i += 1) {
        const x = room.x - room.w * 0.28 + i * room.w * 0.18;
        const y = room.y + (i % 2 ? -room.h * 0.22 : room.h * 0.18);
        drawRoundedRect(ctx, x, y, 45, 28, 7);
        ctx.fill();
        ctx.stroke();
      }
    }

    if (room.type === 'cave' || room.type === 'hidden_cache') {
      ctx.beginPath();
      ctx.ellipse(room.x + room.w * 0.18, room.y - room.h * 0.1, 45, 34, 0, 0, Math.PI * 2);
      ctx.fillStyle = '#15111d';
      ctx.fill();
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#0a0610';
      ctx.stroke();
    }

    if (room.type === 'mushroom_grove' || room.type === 'shrine_grove') {
      for (let i = 0; i < 7; i += 1) {
        const a = (i / 7) * Math.PI * 2;
        const x = room.x + Math.cos(a) * room.w * 0.28;
        const y = room.y + Math.sin(a) * room.h * 0.24;
        ctx.beginPath();
        ctx.ellipse(x, y, 10, 7, 0, 0, Math.PI * 2);
        ctx.fillStyle = i % 2 ? '#b68cff' : '#ff6b91';
        ctx.fill();
        ctx.strokeStyle = '#0a0610';
        ctx.lineWidth = 2;
        ctx.stroke();
      }
    }

    if (room.type === 'boss_grove') {
      ctx.save();
      ctx.strokeStyle = `rgba(229,44,89,${0.25 + Math.sin(game.time * 3) * 0.08})`;
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.ellipse(room.x, room.y, room.w * 0.38, room.h * 0.38, 0, 0, Math.PI * 2);
      ctx.stroke();
      drawOutlinedText(ctx, 'MINI-BOSS GROVE', room.x, room.y - room.h * 0.45, { size: 14, color: '#ff9bb0' });
      ctx.restore();
    }

    if (room.secret && room.discovered) {
      drawOutlinedText(ctx, 'SECRET', room.x, room.y - room.h * 0.42, { size: 12, color: '#ffd166', width: 4 });
    }
    ctx.restore();
  }

  drawExit(ctx, exit, time) {
    if (!exit.discovered) return;
    ctx.save();
    ctx.globalAlpha = exit.unlocked ? 1 : 0.22;
    const pulse = Math.sin(time * 4) * 4;
    ctx.beginPath();
    ctx.arc(exit.x, exit.y, exit.r + pulse, 0, Math.PI * 2);
    ctx.strokeStyle = exit.id === 'entry_exit' ? '#70e8ff' : '#ffd166';
    ctx.lineWidth = 6;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(exit.x, exit.y, exit.r * 0.55, 0, Math.PI * 2);
    ctx.fillStyle = exit.id === 'entry_exit' ? 'rgba(112,232,255,0.18)' : 'rgba(255,209,102,0.22)';
    ctx.fill();
    drawOutlinedText(ctx, exit.label, exit.x, exit.y + exit.r + 24, { size: 12, color: '#ffecc7', width: 4 });
    ctx.restore();
  }

  drawShrine(ctx, shrine, time) {
    if (shrine.used) return;
    ctx.save();
    ctx.translate(shrine.x, shrine.y);
    ctx.strokeStyle = '#0a0610';
    ctx.lineWidth = 4;
    ctx.fillStyle = '#4b306d';
    ctx.beginPath();
    ctx.moveTo(0, -28);
    ctx.lineTo(24, 18);
    ctx.lineTo(-24, 18);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -5, 8 + Math.sin(time * 5) * 2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd166';
    ctx.fill();
    drawOutlinedText(ctx, 'Shrine', 0, 44, { size: 12, color: '#ffecc7', width: 3 });
    ctx.restore();
  }

  drawChest(ctx, chest, time) {
    if (!chest.discovered || chest.opened) return;
    ctx.save();
    ctx.translate(chest.x, chest.y);
    ctx.globalAlpha = chest.hidden ? 0.9 : 1;
    const glow = chest.dangerous ? '#ff315f' : '#ffd166';
    ctx.shadowColor = glow;
    ctx.shadowBlur = 10 + Math.sin(time * 4) * 4;
    ctx.fillStyle = chest.dangerous ? '#7e1233' : '#8a5a20';
    drawRoundedRect(ctx, -24, -16, 48, 32, 7);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = '#0a0610';
    ctx.lineWidth = 4;
    ctx.stroke();
    ctx.fillStyle = '#ffd166';
    ctx.fillRect(-4, -16, 8, 32);
    ctx.fillRect(-22, -2, 44, 8);
    drawOutlinedText(ctx, chest.dangerous ? 'Risk' : 'Chest', 0, 38, { size: 11, color: chest.dangerous ? '#ff9bb0' : '#ffecc7', width: 3 });
    ctx.restore();
  }

  drawTree(ctx, x, y, r, hue = 0) {
    ctx.save();
    ctx.fillStyle = '#17100e';
    drawRoundedRect(ctx, x - r * 0.13, y + r * 0.18, r * 0.26, r * 0.8, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x, y, r, r * 0.75, 0, 0, Math.PI * 2);
    ctx.fillStyle = hue > 0 ? '#315f3c' : '#244f34';
    ctx.fill();
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#0a0610';
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x - r * 0.2, y - r * 0.15, r * 0.35, r * 0.23, -0.4, 0, Math.PI * 2);
    ctx.fillStyle = hue > 0 ? '#438a50' : '#337542';
    ctx.fill();
    ctx.restore();
  }

  drawRock(ctx, x, y, r) {
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(x - r, y + r * 0.12);
    ctx.lineTo(x - r * 0.42, y - r * 0.8);
    ctx.lineTo(x + r * 0.5, y - r * 0.65);
    ctx.lineTo(x + r, y + r * 0.24);
    ctx.lineTo(x + r * 0.28, y + r * 0.8);
    ctx.closePath();
    ctx.fillStyle = '#59616b';
    ctx.fill();
    ctx.strokeStyle = '#0a0610';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.restore();
  }
}
