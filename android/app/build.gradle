plugins {
    id 'com.android.application'
}

android {
    namespace 'com.soumikdas92.dagerhunter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soumikdas92.dagerhunter'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}

// Keep the browser/PWA source as the single source of truth.
// The APK build copies it into Android assets at build time.
def webAssetOutput = layout.projectDirectory.dir('src/main/assets/www')

tasks.register('syncWebAssets', Copy) {
    description = 'Copies the HTML5 game into the Android WebView assets directory.'
    group = 'build setup'

    from(rootProject.projectDir.parentFile) {
        include 'index.html'
        include 'styles.css'
        include 'manifest.webmanifest'
        include 'sw.js'
        include 'assets/**'
        include 'src/**'
        exclude '**/.git/**'
        exclude 'android/**'
        exclude 'node_modules/**'
    }

    into webAssetOutput
}

preBuild.dependsOn tasks.named('syncWebAssets')
