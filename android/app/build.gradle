plugins {
    id 'com.android.application'
}

android {
    namespace 'com.soumikdas92.dagerhunter'
    compileSdk 35

    defaultConfig {
        applicationId 'com.soumikdas92.dagerhunter'
        minSdk 21
        targetSdk 35
        versionCode 2
        versionName '0.1.1'
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // No runtime dependencies: the APK is a tiny native WebView shell around the bundled game.
}

// Keep the browser/PWA source as the single source of truth.
// The APK build copies the single-file game bundle into Android assets at build time.
def webAssetOutput = layout.projectDirectory.dir('src/main/assets/www')

tasks.register('syncWebAssets', Copy) {
    description = 'Copies the offline single-file game into the Android WebView assets directory.'
    group = 'build setup'

    doFirst {
        delete webAssetOutput
    }

    from(rootProject.projectDir.parentFile) {
        include 'downloadable/DagerHunter-PC.html'
        eachFile { details ->
            details.path = details.name
        }
        includeEmptyDirs = false
    }

    into webAssetOutput
}

preBuild.dependsOn tasks.named('syncWebAssets')
